<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      (function() {
        var hostname = window.location.hostname;
        var isBarber = hostname.includes('amadobarber') || hostname.includes('localhost'); 
        // Cambia 'localhost' al dominio que prefieras probar localmente

        // Configuración de rutas
        var manifestPath = isBarber ? '/manifest-barber.webmanifest' : '/manifest-client.webmanifest';
        var iconPath = isBarber ? '/icons/barber/' : '/icons/client/';
        var appName = isBarber ? 'AmadoBarber' : 'AmadoBook';

        // Cambiar título de la página
        document.title = appName;
        var metaAppleTitle = document.createElement('meta');
        metaAppleTitle.name = 'apple-mobile-web-app-title';
        metaAppleTitle.content = appName;
        document.head.appendChild(metaAppleTitle);

        // Añadir manifest
        var linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = manifestPath;
        document.head.appendChild(linkManifest);

        // Añadir favicons básicos
        var favicons = [
          { rel: 'icon', type: 'image/png', sizes: '32x32', href: iconPath + 'icon-32.png' },
          { rel: 'icon', type: 'image/png', sizes: '16x16', href: iconPath + 'icon-16.png' },
          { rel: 'shortcut icon', href: iconPath + 'favicon.ico' }
        ];

        // Añadir iconos de iOS
        var appleIcons = [
          { rel: 'apple-touch-icon', href: iconPath + 'icon-180.png' },
          { rel: 'apple-touch-icon', sizes: '152x152', href: iconPath + 'icon-152.png' },
          { rel: 'apple-touch-icon', sizes: '167x167', href: iconPath + 'icon-167.png' },
          { rel: 'apple-touch-icon', sizes: '180x180', href: iconPath + 'icon-180.png' }
        ];

        var allIcons = favicons.concat(appleIcons);
        allIcons.forEach(function(icon) {
          var link = document.createElement('link');
          link.rel = icon.rel;
          link.href = icon.href;
          if (icon.type) link.type = icon.type;
          if (icon.sizes) link.sizes = icon.sizes;
          document.head.appendChild(link);
        });
      })();
    </script>

    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/icons/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/icons/splash-750x1334.png" />

    <meta name="description" content="Premium barbershop management and booking." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />

    <style>
      /* ── Reset ── */
      html, body, #root {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow-x: hidden;
      }
      body { background: #0D0D0D; } /* Este color será sobreescrito por tu context de tema, pero da un buen fallback */

      /* ── Global box model ── */
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Font defaults ── */
      body, input, select, textarea, button {
        font-family: 'Plus Jakarta Sans', 'DM Sans', system-ui, sans-serif;
      }

      /* ── CRITICAL: 16px on inputs prevents iPhone zoom ── */
      input, select, textarea { font-size: 16px !important; }

      /* ── Prevent iOS bounce scroll on body ── */
      html { height: -webkit-fill-available; }
      body { min-height: -webkit-fill-available; }

      /* ── Smooth momentum scroll ── */
      * { -webkit-overflow-scrolling: touch; }

      /* ── Safe-area variable for easy use ── */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
